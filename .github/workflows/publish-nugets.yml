name: Publish NuGets

on:
  workflow_call:
    secrets:
      registryApiKey:
        required: true
    inputs:
      projectOrSlnDir:
        description: "Project or Solution Directory"
        required: true
        type: string
      prerelease:
        description: "Is Prerelease"
        required: true
        type: boolean
        default: true
      majorVersion:
        description: "Major Version"
        required: true
        type: number
        default: 1
      minorVersion:
        description: "Minor Version"
        required: true
        type: number
        default: 0
      registryName:
        description: "Registry Name"
        required: false
        type: string
        default: "nuget.org"
      registryUri:
        description: "Registry Uri"
        required: false
        type: string
        default: "https://api.nuget.org/v3/index.json"
      runTests:
        description: "Run Tests"
        required: false
        type: boolean
        default: false
      testsPath:
        description: "Tests Path"
        required: false
        type: string
        default: ""

env:
  PKG_VERSION: "${{ inputs.majorVersion }}.${{ inputs.minorVersion }}.${{ github.run_number }}"

jobs:
  build_and_publish_nugets:
    permissions: write-all
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: bitbound/workflows/.github/actions/setup-dotnet-latest@main

      - name: Restore dependencies
        run: dotnet restore "${{ inputs.projectOrSlnDir }}"

      - name: Build (Dev)
        if: ${{ inputs.prerelease }}
        run: dotnet build -c Release -p:FileVersion="${{ env.PKG_VERSION }}" -p:AssemblyVersion="${{ env.PKG_VERSION }}" -p:VersionPrefix="${{ env.PKG_VERSION }}" -p:VersionSuffix="dev" "${{ inputs.projectOrSlnDir }}"

      - name: Build (Prod)
        if: ${{ inputs.prerelease == false }}
        run: dotnet build -c Release -p:FileVersion="${{ env.PKG_VERSION }}" -p:AssemblyVersion="${{ env.PKG_VERSION }}" -p:VersionPrefix="${{ env.PKG_VERSION }}" "${{ inputs.projectOrSlnDir }}"

      - name: Test
        if: ${{ inputs.runTests }}
        run: dotnet test --no-build -c Release "${{ inputs.testsPath }}"

      - name: Pack (Dev)
        if: ${{ inputs.prerelease }}
        run: dotnet pack -c Release -p:FileVersion="${{ env.PKG_VERSION }}" -p:AssemblyVersion="${{ env.PKG_VERSION }}" -p:VersionPrefix="${{ env.PKG_VERSION }}" -p:VersionSuffix="dev" -o "$env:GITHUB_WORKSPACE/packages" "${{ inputs.projectOrSlnDir }}"

      - name: Pack (Prod)
        if: ${{ inputs.prerelease == false }}
        run: dotnet pack -c Release -p:FileVersion="${{ env.PKG_VERSION }}" -p:AssemblyVersion="${{ env.PKG_VERSION }}" -p:VersionPrefix="${{ env.PKG_VERSION }}" -o "$env:GITHUB_WORKSPACE/packages" "${{ inputs.projectOrSlnDir }}"

      # https://github.com/NuGet/Home/issues/12537
      - name: Add or Update GitHub NuGet Source
        shell: pwsh
        run: |
          [string]$Sources = dotnet nuget list source

          if (!($Sources -imatch "\d*. ${{ inputs.registryName }}")) {
            dotnet nuget add source --name "${{ inputs.registryName }}" "${{ inputs.registryUri }}"
          }
          else {
            Write-Output "Source exists.  Updating."
            dotnet nuget update source "${{ inputs.registryName }}" --source "${{ inputs.registryUri }}"
          }

      - name: NuGet Push
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/packages" -Include "*.nupkg", "*.snupkg" -Recurse

          if ($packages.Count -eq 0) {
            Write-Output "No packages found to push."
            exit 0
          }

          Write-Output "Found $($packages.Count) package(s) to push."
          dotnet nuget push "$env:GITHUB_WORKSPACE/packages/" --source "${{ inputs.registryName }}" --api-key "${{ secrets.registryApiKey }}" --skip-duplicate
